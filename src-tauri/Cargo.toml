[package]
name = "unzeit"
version = "0.4.1"
edition = "2021"
description = "A private library for learning on your own time"
license = "MIT"

[lib]
name = "unzeit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "unzeit"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager", "dep:gio"]
webview-smoke = ["desktop", "dep:webkit2gtk", "dep:cairo-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
ffmpeg-sidecar = "2"
hound = "3.5"
natord = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true, default-features = false, features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.16"
webkit2gtk = { version = "2", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
